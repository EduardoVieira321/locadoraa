<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <title>Formulário de Cadastro - GuiEduLocates</title>
  <link rel="stylesheet" href="css/cadastro_usuario.css"/>
</head>
<body>
  <main class="container-cadastro">
    <h2>Crie sua conta na GuiEduLocates</h2>
    <form>
      <div class="campo">
        <input type="text" id="usuario" name="usuario" required placeholder="Nome de usuário" />
      </div>

      <div class="campo">
        <input type="password" id="senha" name="senha" required placeholder="Senha segura" />
      </div>

      <div class="campo">
        <input type="text" id="nome" name="nome" required placeholder="Nome completo" />
      </div>

      <div class="campo">
        <input type="email" id="email" name="email" required placeholder="E-mail válido" />
      </div>

      <div class="campo">
        <input type="text" id="endereco" name="endereco" required placeholder="Endereço completo" />
      </div>

      <div class="campo-duplo">
        <input type="text" id="cidade" name="cidade" required placeholder="Cidade" />
        <select id="estado" name="estado" required>
          <option value="" disabled selected>Estado</option>
          <option value="AC">Acre</option>
          <option value="AL">Alagoas</option>
          <option value="AP">Amapá</option>
          <option value="GO">Goiás</option>
          <option value="BA">Bahia</option>
          <option value="AM">Amazonas</option>
          <option value="CE">Ceará</option>
          <option value="DF">Distrito Federal</option>
          <option value="ES">Espírito Santo</option>
          <option value="MS">Mato Grosso do Sul</option>
          <option value="MA">Maranhão</option>
          <option value="MT">Mato Grosso</option>
          <option value="MG">Minas Gerais</option>
          <option value="PA">Pará</option>
          <option value="RR">Roraima</option>
          <option value="PB">Paraíba</option>
          <option value="PR">Paraná</option>
          <option value="PE">Pernambuco</option>
          <option value="PI">Piauí</option>
          <option value="RN">Rio Grande do Norte</option>
          <option value="RJ">Rio de Janeiro</option>
          <option value="RS">Rio Grande do Sul</option>
          <option value="RO">Rondônia</option>
          <option value="SE">Sergipe</option>
          <option value="SC">Santa Catarina</option>
          <option value="SP">São Paulo</option>
          <option value="TO">Tocantins</option>
        </select>
      </div>

      <fieldset>
        <legend>Qual seu gênero?</legend>
        <label><input type="radio" name="sexo" value="masculino" /> Masculino</label>
        <label><input type="radio" name="sexo" value="feminino" /> Feminino</label>
        <label><input type="radio" name="sexo" value="outro" /> Outro</label>
      </fieldset>

      <fieldset>
        <legend>Gêneros de filmes favoritos</legend>
        <label><input type="checkbox" name="filmes" value="acao" /> Ação</label>
        <label><input type="checkbox" name="filmes" value="comedia" /> Comédia</label>
        <label><input type="checkbox" name="filmes" value="drama" /> Drama</label>
        <label><input type="checkbox" name="filmes" value="terror" /> Terror</label>
        <label><input type="checkbox" name="filmes" value="ficcao" /> Ficção Científica</label>
        <label><input type="checkbox" name="filmes" value="romance" /> Romance</label>
      </fieldset>

      <div class="botoes">
        <button class="btn-cancelar">Cancelar</button>
        <button type="reset" class="btn-limpar">Limpar</button>
        <button class="btn-cadastrar">Cadastrar</button>
      </div>
    </form>
  </main>

  <a href="index.html" class="link-voltar">←    Voltar para o início</a>
</body>
</html>
